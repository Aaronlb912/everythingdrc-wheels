name: Sync wheel from Discord
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      - run: |
          [ -z "$(git status --porcelain data.json)" ] && exit 0
          git config user.name "wheel-sync"
          git config user.email "wheel-sync@users.noreply.github.com"
          git add data.json
          git commit -m "sync wheel entries"
          git push
